services:
  # ── Backend: FastAPI Web Service ─────────────────────────────────────────
  - type: web
    name: rewardiq-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt && python -m textblob.download_corpora
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: ENVIRONMENT
        value: production
      - key: PYTHONPATH
        value: .
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "https://rewardiq-frontend.onrender.com"
      - key: OPENROUTER_API_KEY
        sync: false

  # ── Frontend: Static Site ────────────────────────────────────────────────
  - type: static
    name: rewardiq-frontend
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://rewardiq-backend.onrender.com/api/v1
      - key: NODE_VERSION
        value: "20.19.0"
